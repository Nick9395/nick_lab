<!-- index.html -->
<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nick Lab</title>

    <!-- SEO -->
    <meta
      name="description"
      content="Nickのポートフォリオ保管用サイト。学習目的で制作したWebアプリを公開しています。"
    />
    <meta
      name="keywords"
      content="Nick Lab, Nick, ポートフォリオ, Webアプリ, ドット画伯, ガンバリクエスト"
    />
    <meta name="author" content="Nick" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#151515" />
    <link rel="canonical" href="https://nick9395.github.io/nick_lab/" />
    <link rel="icon" href="images/avatar.webp" type="image/webp" />

    <!-- Open Graph（Facebook, LinkedIn など） -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Nick Lab" />
    <meta property="og:title" content="Nick Lab" />
    <meta
      property="og:description"
      content="Nickのポートフォリオ保管用サイト。学習目的で制作したWebアプリを公開しています。"
    />
    <meta property="og:url" content="https://nick9395.github.io/nick_lab/" />
    <meta
      property="og:image"
      content="https://nick9395.github.io/nick_lab/images/top_image.webp"
    />
    <meta property="og:locale" content="ja_JP" />

    <!-- Twitter / X Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Nick Lab" />
    <meta
      name="twitter:description"
      content="Nickのポートフォリオ保管用サイト。学習目的で制作したWebアプリを公開しています。"
    />
    <meta
      name="twitter:image"
      content="https://nick9395.github.io/nick_lab/images/top_image.webp"
    />

    <link rel="stylesheet" href="application.css" />
    <script src="application.js" defer></script>
  </head>

  <body>
    <!-- 背景画像レイヤー -->
    <div class="background" aria-hidden="true"></div>

    <!-- ヘッダー -->
    <header class="header">
      <nav class="nav" aria-label="メインナビゲーション">
        <ul class="nav__list">
          <!-- data-menu 属性でどのメニューを開くかを管理 -->
          <li>
            <a href="#" data-menu="top" class="nav__brand" aria-label="Nick Lab">
              <img src="images/avatar.webp" alt="" class="top-icon-size" />
              <span>Nick Lab</span>
            </a>
          </li>
          <li><a href="#" data-menu="portfolio">portfolio</a></li>
          <li><a href="#" data-menu="about">about</a></li>
          <li><a href="#" data-menu="contact">contact</a></li>

          <!-- 外部リンク（SNS） -->
          <li>
            <a
              href="https://x.com/"
              target="_blank"
              rel="noopener noreferrer"
              aria-label="X(Twitter)へ移動"
            >
              <img src="images/x-logo.webp" alt="" class="top-icon-size" />
            </a>
          </li>
          <li>
            <a
              href="https://note.com/"
              target="_blank"
              rel="noopener noreferrer"
              aria-label="noteへ移動"
            >
              <img src="images/note-logo.webp" alt="" class="top-icon-size" />
            </a>
          </li>
          <li>
            <a
              href="https://github.com/Nick9395"
              target="_blank"
              rel="noopener noreferrer"
              aria-label="GitHubへ移動"
            >
              <img src="images/github-logo.webp" alt="" class="top-icon-size" />
            </a>
          </li>
        </ul>
      </nav>
    </header>

    <!-- サイドバー（メニュー展開時に表示） -->
    <aside class="sidebar" id="sidebar" aria-label="サブメニュー">
      <ul id="sidebarMenu" class="sidebar__menu"></ul>
    </aside>

    <!-- メインコンテンツ表示エリア -->
    <main class="main" id="mainContent">
      <p id="contentText" class="main__text"></p>
    </main>
  </body>
</html>
